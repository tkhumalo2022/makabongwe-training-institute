name: Admin auth security gate

on:
  pull_request:
    paths:
      - "app/admin/**"
      - "app/auth/**"
      - "app/api/auth/**"
      - "app/lib/admin-auth.ts"
      - "app/lib/request-security.ts"
      - "app/lib/turnstile.ts"
      - "tests/auth-security.test.mjs"
      - ".env.example"
      - ".github/workflows/auth-security.yml"

permissions:
  contents: read

concurrency:
  group: auth-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Auth security regression tests
        run: node --test tests/auth-security.test.mjs

      - name: Production build
        run: npm run build
